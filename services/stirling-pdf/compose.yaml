services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - '4000:8080'
    volumes:
      - stirling_training_data:/usr/share/tessdata # Required for extra OCR languages
      - stirling_configs:/configs
      - stirling_custom_files:/customFiles/
      - stirling_logs:/logs/
      - stirling_pipeline:/pipeline/
    environment:
      - DISABLE_ADDITIONAL_FEATURES=false
      - LANGS=en_GB
      - SECURITY_ENABLELOGIN=false
      - SYSTEM_DEFAULTLOCALE=en-GB
    networks:
      - stirling_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stirling_training_data:
  stirling_configs:
  stirling_custom_files:
  stirling_logs:
  stirling_pipeline:

networks:
  stirling_network:
    driver: bridge
    name: stirling_network
