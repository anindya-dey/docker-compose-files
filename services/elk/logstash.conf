input {
  # Beats input (Filebeat)
  beats {
    port => 5044
  }

  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json
  }

  # UDP input for syslog
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Grok patterns for common log formats
  grok {
    match => {
      "message" => [
        "%{COMBINEDAPACHELOG}",
        "%{COMMONAPACHELOG}",
        "%{SYSLOGLINE}"
      ]
    }
  }

  # Add host information
  mutate {
    add_field => {
      "[@metadata][index]" => "logstash-%{+YYYY.MM.dd}"
    }
  }

  # Remove unwanted fields
  mutate {
    remove_field => ["@version", "host"]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index]}"
    manage_template => true
  }

  # Debug output (optional - comment out in production)
  stdout {
    codec => rubydebug
  }
}
